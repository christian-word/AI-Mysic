<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Збірка пісень хвали</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  :root {
    --bg:       #0A0A0A;
    --surface:  #111111;
    --surface2: #181818;
    --surface3: #242424;
    --border:   rgba(255,255,255,0.06);
    --text:     #FFFFFF;
    --muted:    #A0A0A0;
    --hint:     #555555;
    --green:    #1DB954;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Figtree', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    color: var(--text);
  }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-logo {
    width: 32px; height: 32px;
    background: var(--green);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .topbar-logo i { font-size: 16px; color: #000; }
  .topbar-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    flex: 1;
  }
  .topbar-badge {
    font-size: 11px;
    font-weight: 600;
    background: var(--surface3);
    color: var(--muted);
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  /* ── HERO BANNER ── */
  .hero {
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 40%, #0f0f23 70%, var(--bg) 100%);
    padding: 36px 20px 40px;
    position: relative;
    overflow: hidden;
  }
  .hero-glow {
    position: absolute;
    top: -80px; left: 50%;
    transform: translateX(-50%);
    width: 400px; height: 200px;
    background: radial-gradient(ellipse, rgba(29,185,84,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-inner { max-width: 560px; margin: 0 auto; position: relative; }
  .hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 16px;
  }
  .hero-eyebrow i { font-size: 13px; }
  .hero-title {
    font-size: 40px;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -0.025em;
    color: var(--text);
    margin-bottom: 10px;
  }
  .hero-title em { font-style: normal; color: var(--green); }
  .hero-sub {
    font-size: 14px;
    color: var(--muted);
    font-weight: 400;
    margin-bottom: 28px;
    letter-spacing: 0.01em;
  }
  .hero-actions {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .btn-play {
    display: flex; align-items: center; gap: 8px;
    background: var(--green);
    color: #000;
    font-family: 'Figtree', sans-serif;
    font-size: 14px;
    font-weight: 700;
    border: none;
    border-radius: 50px;
    padding: 12px 28px;
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: transform 0.15s, background 0.15s;
  }
  .btn-play:hover { background: #1ed760; transform: scale(1.03); }
  .btn-play i { font-size: 16px; }
  .hero-stats {
    display: flex;
    gap: 20px;
  }
  .hstat-val {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .hstat-label {
    font-size: 11px;
    color: var(--hint);
    margin-top: 3px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* ── MAIN ── */
  .main {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 16px 60px;
  }

  /* ── SEARCH ── */
  .search-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 16px;
    margin: 24px 0 28px;
    transition: border-color 0.15s;
  }
  .search-wrap:focus-within { border-color: rgba(255,255,255,0.2); }
  .search-wrap i { font-size: 17px; color: var(--hint); flex-shrink: 0; }
  .search-wrap input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'Figtree', sans-serif;
    font-size: 14px;
    color: var(--text);
    padding: 14px 0;
  }
  .search-wrap input::placeholder { color: var(--hint); }
  #count-badge {
    font-size: 11px;
    font-weight: 600;
    color: var(--green);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ── TABLE HEADER ── */
  .table-head {
    display: grid;
    grid-template-columns: 32px 46px 1fr 90px 28px;
    align-items: center;
    gap: 12px;
    padding: 0 12px 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 6px;
  }
  .th {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--hint);
  }
  .th-right { text-align: right; }

  /* ── ROWS ── */
  .list { display: flex; flex-direction: column; }

  .track {
    display: grid;
    grid-template-columns: 32px 46px 1fr 90px 28px;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border-radius: 6px;
    text-decoration: none;
    transition: background 0.12s;
    position: relative;
    group: track;
  }
  .track:hover { background: var(--surface3); }
  .track:active { background: var(--surface2); }

  .track-num {
    font-size: 13px;
    color: var(--hint);
    text-align: center;
    position: relative;
  }
  .track-num .num { transition: opacity 0.12s; }
  .track-num .play-icon {
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    color: var(--text);
    opacity: 0;
    transition: opacity 0.12s;
  }
  .track:hover .track-num .num { opacity: 0; }
  .track:hover .track-num .play-icon { opacity: 1; }

  .track-art {
    width: 46px; height: 46px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }

  .track-info { min-width: 0; }
  .track-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track:hover .track-name { color: var(--green); }
  .track-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-genre {
    font-size: 11px;
    font-weight: 600;
    color: var(--hint);
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.03em;
  }
  .track:hover .track-genre { color: var(--muted); }

  .track-arrow {
    font-size: 16px;
    color: var(--hint);
    text-align: center;
    opacity: 0;
    transition: opacity 0.12s, color 0.12s;
  }
  .track:hover .track-arrow { opacity: 1; color: var(--green); }

  /* ── EMPTY ── */
  .empty {
    text-align: center;
    padding: 60px 0;
    color: var(--hint);
  }
  .empty i { font-size: 44px; display: block; margin-bottom: 12px; }
  .empty p { font-size: 14px; }

  /* ── FOOTER ── */
  .footer {
    margin-top: 48px;
    padding: 24px 0;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .footer-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    opacity: 0.6;
  }
  .footer-text { font-size: 12px; color: var(--hint); letter-spacing: 0.04em; }

  @media (max-width: 420px) {
    .hero-title { font-size: 28px; }
    .table-head, .track { grid-template-columns: 28px 40px 1fr 28px; }
    .track-genre { display: none; }
    .th:nth-child(4) { display: none; }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-logo"><i class="ti ti-music"></i></div>
  <div class="topbar-title">Worship Player</div>
  <span class="topbar-badge" id="tb-badge">14 альбомів</span>
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-glow"></div>
  <div class="hero-inner">
    <div class="hero-eyebrow"><i class="ti ti-sparkles"></i> Worship Collection</div>
    <div class="hero-title">Збірка пісень<br><em>і музики</em></div>
    <div class="hero-sub">Хвала та поклоніння · 14 альбомів</div>
    <div class="hero-actions">
      <button class="btn-play"><i class="ti ti-player-play"></i> Відкрити</button>
      <div class="hero-stats">
        <div>
          <div class="hstat-val" id="hero-count">14</div>
          <div class="hstat-label">Альбомів</div>
        </div>
        <div>
          <div class="hstat-val">UA</div>
          <div class="hstat-label">Мова</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="search-wrap">
    <i class="ti ti-search"></i>
    <input id="search" type="text" placeholder="Пошук альбому або жанру..." oninput="filterAlbums(this.value)" />
    <span id="count-badge">14 альбомів</span>
  </div>

  <div class="table-head">
    <span class="th" style="text-align:center">#</span>
    <span class="th"></span>
    <span class="th">Назва</span>
    <span class="th th-right">Жанр</span>
    <span class="th"></span>
  </div>

  <div class="list" id="list"></div>

  <div class="footer">
    <div class="footer-dot"></div>
    <span class="footer-text">Зроблено з любов'ю для хвали та поклоніння</span>
    <div class="footer-dot"></div>
  </div>
</div>

<script>
const albums = [
  { name:"Боже мого серця",       path:"wform.play",   sub:"Хвала та поклоніння",             icon:"ti-heart",       bg:"#2a1020", ic:"#D4537E", genre:"Worship" },
  { name:"Джерело Любові",        path:"wform.play1",  sub:"Хвала та поклоніння",             icon:"ti-droplet",     bg:"#0d1e30", ic:"#378ADD", genre:"Worship" },
  { name:"Я дивлюсь на хрест",    path:"wform.play2",  sub:"Хвала та поклоніння",             icon:"ti-cross",       bg:"#172210", ic:"#639922", genre:"Worship" },
  { name:"Majestic Instrumental", path:"wform.play3",  sub:"Інструментальний",                icon:"ti-piano",       bg:"#16152a", ic:"#7F77DD", genre:"Інстр." },
  { name:"Боже мого серця (v4)",  path:"wform.play4",  sub:"Хвала та поклоніння",             icon:"ti-heart",       bg:"#2a1020", ic:"#D4537E", genre:"Worship" },
  { name:"Хто достойний слави",   path:"wform.play5",  sub:"Хвала та поклоніння",             icon:"ti-sparkles",    bg:"#0d2219", ic:"#1D9E75", genre:"Worship" },
  { name:"В Твоїй тиші",          path:"wform.play6",  sub:"Хвала та поклоніння",             icon:"ti-feather",     bg:"#1c1a18", ic:"#888780", genre:"Worship" },
  { name:"Angelic Epic",          path:"wform.play7",  sub:"Епічний",                         icon:"ti-star",        bg:"#231a08", ic:"#EF9F27", genre:"Епічний" },
  { name:"Під Твоїми крилами",    path:"wform.play8",  sub:"Хвала та поклоніння",             icon:"ti-butterfly",   bg:"#0d1e30", ic:"#378ADD", genre:"Worship" },
  { name:"Надія Жива",            path:"wform.play9",  sub:"Хвала та поклоніння",             icon:"ti-sun",         bg:"#231a08", ic:"#EF9F27", genre:"Worship" },
  { name:"Надія Жива (v2)",       path:"wform.play10", sub:"Акустична версія",                icon:"ti-sun",         bg:"#1a1208", ic:"#BA7517", genre:"Інстр." },
  { name:"Celestial Ambient",     path:"wform.play11", sub:"Інструментал",                    icon:"ti-galaxy",      bg:"#16152a", ic:"#7F77DD", genre:"Інстр." },
  { name:"Ти зі мною",            path:"wform.play12", sub:"Варіанти пісень",                 icon:"ti-player-play", bg:"#2a1020", ic:"#D4537E", genre:"Worship" },
  { name:"AI Music Collection",   path:"wform.play13", sub:"Інструментальні композиції",       icon:"ti-wand",        bg:"#0d2219", ic:"#1D9E75", genre:"AI Music"}
];

function render(items) {
  const list = document.getElementById('list');
  const badge = document.getElementById('count-badge');
  const tbBadge = document.getElementById('tb-badge');
  const heroCount = document.getElementById('hero-count');
  const txt = items.length + ' альбомів';
  badge.textContent = txt;
  tbBadge.textContent = txt;
  heroCount.textContent = items.length;

  if (!items.length) {
    list.innerHTML = '<div class="empty"><i class="ti ti-mood-sad"></i><p>Нічого не знайдено</p></div>';
    return;
  }

  list.innerHTML = items.map((a, i) => `
    <a class="track" href="https://christian-word.github.io/AI-Mysic/${a.path}/player.html" target="_blank">
      <div class="track-num">
        <span class="num">${String(i+1).padStart(2,'0')}</span>
        <span class="play-icon"><i class="ti ti-player-play"></i></span>
      </div>
      <div class="track-art" style="background:${a.bg};">
        <i class="ti ${a.icon}" style="color:${a.ic};"></i>
      </div>
      <div class="track-info">
        <div class="track-name">${a.name}</div>
        <div class="track-sub">${a.sub}</div>
      </div>
      <div class="track-genre">${a.genre}</div>
      <div class="track-arrow"><i class="ti ti-chevron-right"></i></div>
    </a>
  `).join('');
}

function filterAlbums(q) {
  const lq = q.toLowerCase();
  const filtered = q ? albums.filter(a =>
    a.name.toLowerCase().includes(lq) ||
    a.sub.toLowerCase().includes(lq) ||
    a.genre.toLowerCase().includes(lq)
  ) : albums;
  render(filtered);
}

render(albums);
</script>
</body>
</html>
