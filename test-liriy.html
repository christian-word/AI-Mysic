<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyria Test</title>
  <style>body {padding: 30px; font-family: Arial;}</style>
</head>
<body>
  <h1>Тест Lyria 3 Pro</h1>
  <button onclick="generateSong()">Створити пісню</button>
  
  <div id="status" style="margin:20px 0; font-weight:bold;">Натисни кнопку</div>
  <div id="log" style="background:#f0f0f0; padding:15px; height:300px; overflow:auto; white-space:pre-wrap;"></div>

  <script>
    const API_KEY = "AIzaSyABRwIKwkNgNYCeaU9T-e7qTRtkGpMoLMs";   // ← ОБОВ'ЯЗКОВО заміни

    function log(msg) {
      const el = document.getElementById('log');
      el.innerHTML += msg + "\n";
      el.scrollTop = el.scrollHeight;
      console.log(msg);
    }

    async function generateSong() {
      const status = document.getElementById('status');
      status.textContent = "Кнопка натиснута...";

      if (!API_KEY || API_KEY.includes("ВСТАВ")) {
        status.textContent = "❌ Не вставлений API ключ!";
        log("Помилка: API ключ не вставлений");
        return;
      }

      log("🚀 Початок запиту...");

      try {
        log("Відправляємо запит до Google...");

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/lyria-3-pro-preview:generateContent?key=${API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ 
              parts: [{ 
                text: "Create a short happy piano melody" 
              }] 
            }]
          })
        });

        log(`Отримали відповідь. Статус: ${response.status}`);

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`HTTP ${response.status}: ${errorText}`);
        }

        const data = await response.json();
        log("✅ Запит успішний! Але аудіо поки не обробляємо.");
        status.textContent = "✅ Запит пройшов успішно (перевір консоль)";

      } catch (err) {
        console.error(err);
        status.textContent = "❌ Помилка: " + err.message;
        log("❌ ПОМИЛКА: " + err.message);
      }
    }

    // Перевірка при завантаженні сторінки
    window.onload = () => {
      log("Сторінка завантажена. API_KEY присутній: " + (API_KEY && !API_KEY.includes("ВСТАВ")));
    };
  </script>
</body>
</html>
