<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест Lyria 3 Pro (Статический)</title>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: #fff; padding: 30px; }
        .container { max-width: 600px; margin: 0 auto; background: #2d2d2d; padding: 20px; border-radius: 8px; }
        textarea { width: 100%; height: 120px; background: #3a3a3a; color: #fff; border: 1px solid #555; padding: 10px; box-sizing: border-box; border-radius: 4px; margin-bottom: 15px; }
        input[type="password"] { width: 100%; padding: 10px; background: #3a3a3a; color: #fff; border: 1px solid #555; box-sizing: border-box; border-radius: 4px; margin-bottom: 15px; }
        button { background: #1a73e8; color: white; border: none; padding: 12px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; margin-top: 5px; }
        button:hover { background: #155cb4; }
        #status { margin-top: 20px; color: #aaedf9; font-weight: bold; word-break: break-word; }
        audio { width: 100%; margin-top: 20px; display: none; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #ccc; }
    </style>
</head>
<body>

<div class="container">
    <h2>Генерация музыки через Lyria 3 Pro</h2>
    
    <label for="apiKey">Ваш Google API Key:</label>
    <input type="password" id="apiKey" placeholder="Введите API ключ (сохраняется локально в браузере)">

    <label for="prompt">Промпт с разметкой по времени:</label>
    <textarea id="prompt">Pure instrumental, no vocals, 100% no voices, Cinematic christian instrumental, ethereal atmosphere, warm autumn vibes, peaceful and inspiring, sounds of a flowing stream, gentle piano and soaring strings, nature soundscape, pure instrumental, no vocals, 72 bpm

[Intro: Soft ethereal texture, smooth atmosphere entry]
[Section 1: Gentle lead melody enters softly, establishing the focus]
[Section 2: Secondary atmospheric layers begin to blend in, adding depth]
[Climax: Full beautiful arrangement rise, high emotional harmony]
[Section 3: Heavy elements recede, returning to gentle quiet instrumentation]
[Outro: Final warm notes fading out slowly into complete quiet space]
[End - 3:00]</textarea>
    
    <button id="generateBtn">Запустить генерацию</button>
    
    <div id="status">Ожидание запуска...</div>
    <audio id="player" controls></audio>
</div>

<script>
    // При загрузке страницы проверяем, есть ли сохраненный ключ в LocalStorage
    document.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('lyria_api_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }
    });

    document.getElementById('generateBtn').addEventListener('click', async () => {
        const statusDiv = document.getElementById('status');
        const player = document.getElementById('player');
        const promptText = document.getElementById('prompt').value;
        const apiKey = document.getElementById('apiKey').value.trim();
        
        if (!apiKey) {
            statusDiv.innerText = "Ошибка: Пожалуйста, введите ваш API-ключ!";
            return;
        }

        // Сохраняем ключ в локальное хранилище браузера, чтобы не вводить каждый раз
        localStorage.setItem('lyria_api_key', apiKey);
        
        statusDiv.innerText = "Отправка запроса напрямую в Google API...";
        player.style.display = 'none';

        const googleUrl = `https://generativelanguage.googleapis.com/v1beta/models/lyria-3-pro-preview:generateContent?key=${apiKey}`;

        const apiPayload = {
            contents: [
                {
                    parts: [
                        { text: promptText }
                    ]
                }
            ]
        };

        try {
            const response = await fetch(googleUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(apiPayload)
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                const serverErr = errorData.error?.message || 'Ошибка API';
                throw new Error(`${serverErr} (Статус: ${response.status})`);
            }

            const data = await response.json();
            let audioUrl = "";

            if (data.candidates && data.candidates[0]?.content?.parts) {
                const parts = data.candidates[0].content.parts;
                for (const part of parts) {
                    if (part.inlineData && part.inlineData.data) {
                        const base64 = part.inlineData.data;
                        const mimeType = part.inlineData.mimeType;
                        audioUrl = `data:${mimeType};base64,${base64}`;
                        break;
                    }
                }
            }

            if (audioUrl) {
                statusDiv.innerText = "Готово! Слушаем:";
                player.src = audioUrl;
                player.style.display = 'block';
                player.play();
            } else {
                statusDiv.innerText = "Ошибка: Аудио не найдено в ответе от Google API.";
                console.log("Ответ от API:", data);
            }
        } catch (err) {
            statusDiv.innerText = "Ошибка генерации: " + err.message;
            console.error(err);
        }
    });
</script>

</body>
</html>
