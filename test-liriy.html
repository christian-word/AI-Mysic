<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyria 3 Pro — Християнська пісня</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
    button { padding: 15px 30px; font-size: 18px; cursor: pointer; }
    #status { font-weight: bold; margin: 15px 0; min-height: 28px; }
    #log { background: #f4f4f4; padding: 15px; border-radius: 8px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 14px; white-space: pre-wrap; }
    audio { width: 100%; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>🎵 Lyria 3 Pro — Генерація християнської пісні</h1>
  <button onclick="generateSong()">Створити пісню</button>
  
  <div id="status">Натисніть кнопку для початку</div>
  <div id="log"></div>
  <audio id="audioPlayer" controls></audio>

  <script type="module">
    const API_KEY = "AIzaSyABRwIKwkNgNYCeaU9T-e7qTRtkGpMoLMs";   // ←←← Зміни на свій ключ

    const prompt = `Create a beautiful, emotional 2.5 to 3-minute contemporary Christian worship song in proper Ukrainian language with a warm, anointed female soprano vocalist.

Style: Modern worship like Hillsong, Bethel Music — piano-driven, cinematic.

Theme: Gratitude to God for His love and grace.

[Intro] Soft piano.
[Verse 1] Ти підняв мене з пилу, з темряви ночі...
[Chorus] Я дякую Тобі, Господь, за милість Твою...
[Verse 2] Крізь бурі і вогонь, Ти ведеш мене...
[Bridge] Я віддаю Тобі все, що маю...
[Final Chorus] Я дякую Тобі, Господь...
[Outro] Ти — моя надія...`;

    function log(message, type = "info") {
      const logEl = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      logEl.innerHTML += `[${time}] ${message}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function generateSong() {
      const status = document.getElementById('status');
      const player = document.getElementById('audioPlayer');
      const logEl = document.getElementById('log');
      
      logEl.innerHTML = ""; // очищаємо лог
      player.src = "";
      status.textContent = "Відправляємо запит на сервер...";
      log("🚀 Запит відправлено...");

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/lyria-3-pro-preview:generateContent?key=${API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        log("✅ Отримали відповідь від сервера");

        if (!response.ok) {
          throw new Error(`HTTP помилка: ${response.status}`);
        }

        const data = await response.json();
        log("📦 Дані розпарсено");

        // Шукаємо аудіо
        const audioPart = data.candidates?.[0]?.content?.parts?.find(part => part.inlineData);
        
        if (audioPart && audioPart.inlineData) {
          log("🎵 Аудіо знайдено, обробляємо...");
          status.textContent = "Обробка аудіо...";

          const audioData = audioPart.inlineData.data;
          const byteCharacters = atob(audioData);
          const byteNumbers = new Array(byteCharacters.length);
          for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
          }
          const blob = new Blob([new Uint8Array(byteNumbers)], { type: 'audio/mp3' });
          
          player.src = URL.createObjectURL(blob);
          status.textContent = "✅ Пісня готова! Слухай 👇";
          log("🎉 Аудіо успішно відтворено");
        } else {
          status.textContent = "❌ Аудіо не знайдено в відповіді";
          log("⚠️ Аудіо частина відсутня", "error");
          console.log("Повна відповідь:", data);
        }
      } catch (error) {
        console.error(error);
        status.textContent = "❌ Помилка: " + error.message;
        log("❌ Помилка: " + error.message, "error");
      }
    }
  </script>
</body>
</html>
