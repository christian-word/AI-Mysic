<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Плеєр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #15130F;
    --surface: #211E17;
    --surface-raised: #2A2619;
    --accent: #C9973B;
    --accent-dim: #8A6B33;
    --text: #EDE7D9;
    --text-secondary: #A39B87;
    --text-muted: #6F6852;
    --border: #33301F;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    line-height: 1.5;
  }

  .wrap{
    max-width: 1040px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 40px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }

  header h1{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 28px;
    letter-spacing: -0.01em;
  }

  header .meta{
    font-size: 13px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  /* ===== Player deck ===== */
  .deck{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 28px 32px;
    display: grid;
    grid-template-columns: 96px 1fr auto;
    gap: 28px;
    align-items: center;
    margin-bottom: 20px;
  }

  .art{
    width: 96px;
    height: 96px;
    border-radius: 4px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--text-muted);
    flex-shrink:0;
  }

  .art svg{ width: 34px; height: 34px; }

  .now-playing .track-title{
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .now-playing .track-sub{
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 16px;
  }

  .transport{
    display:flex;
    align-items:center;
    gap: 6px;
  }

  .transport button{
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 8px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius: 4px;
    transition: color 0.15s ease, background 0.15s ease;
  }

  .transport button:hover{ color: var(--text); background: var(--surface-raised); }

  .transport button.play{
    background: var(--accent);
    color: #15130F;
    width: 40px;
    height: 40px;
    border-radius: 50%;
  }

  .transport button.play:hover{ background: #DBA84E; }

  .transport svg{ width: 18px; height: 18px; }
  .transport button.play svg{ width: 16px; height: 16px; }

  .scrub{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-top: 14px;
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .scrub-track{
    flex:1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    position: relative;
    cursor: pointer;
  }

  .scrub-fill{
    height:100%;
    width: 0%;
    background: var(--accent);
    border-radius: 2px;
  }

  /* VU meter */
  .vu{
    display:flex;
    align-items:flex-end;
    gap: 3px;
    height: 64px;
    width: 120px;
  }

  .vu span{
    flex:1;
    background: var(--accent-dim);
    border-radius: 1px;
    height: 12%;
    transition: height 0.1s ease;
  }

  .vu span.active{ background: var(--accent); }

  /* ===== Library ===== */
  .library-head{
    display:flex;
    align-items:baseline;
    justify-content: space-between;
    margin: 44px 0 16px;
  }

  .library-head h2{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 18px;
  }

  .library-head span{
    font-size: 12px;
    color: var(--text-muted);
  }

  .albums{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }

  .album-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }

  .album-card:hover{ border-color: var(--accent-dim); }

  .album-cover{
    width: 100%;
    aspect-ratio: 1;
    border-radius: 4px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .album-cover svg{ width: 26px; height: 26px; }

  .album-name{
    font-family: 'Fraunces', serif;
    font-size: 15px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .album-count{
    font-size: 12px;
    color: var(--text-muted);
  }

  /* Track list inside expanded album */
  .tracklist{
    display:none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-top:none;
    border-radius: 0 0 6px 6px;
    margin-top: -16px;
    margin-bottom: 16px;
    padding: 8px 0;
  }

  .tracklist.open{ display:block; }

  .track-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 10px 20px;
    cursor:pointer;
    font-size: 14px;
    color: var(--text-secondary);
    border-top: 1px solid var(--border);
  }

  .track-row:first-child{ border-top: none; }

  .track-row:hover{ color: var(--text); background: var(--surface-raised); }

  .track-row.playing{ color: var(--accent); }

  .track-row .dur{
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .empty-state{
    padding: 40px 20px;
    text-align:center;
    color: var(--text-muted);
    font-size: 14px;
    border: 1px dashed var(--border);
    border-radius: 6px;
  }

  @media (max-width: 560px){
    .deck{ grid-template-columns: 1fr; }
    .vu{ display:none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Плеєр</h1>
    <span class="meta" id="track-count">— треків</span>
  </header>

  <div class="deck">
    <div class="art" id="now-art">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>
    </div>

    <div class="now-playing">
      <div class="track-title" id="now-title">Оберіть трек</div>
      <div class="track-sub" id="now-sub">—</div>

      <div class="transport">
        <button id="prev-btn" aria-label="Попередній трек">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="play" id="play-btn" aria-label="Відтворити">
          <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="next-btn" aria-label="Наступний трек">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
        </button>
      </div>

      <div class="scrub">
        <span id="time-current">0:00</span>
        <div class="scrub-track" id="scrub-track">
          <div class="scrub-fill" id="scrub-fill"></div>
        </div>
        <span id="time-total">0:00</span>
      </div>
    </div>

    <div class="vu" id="vu-meter"></div>
  </div>

  <div class="library-head">
    <h2>Альбоми</h2>
    <span id="albums-meta">—</span>
  </div>

  <div id="albums-container"></div>
</div>

<audio id="audio-el" preload="metadata"></audio>

<script>
/* =========================================================
   ДАНІ: читаються з albums.json у корені репозиторію.
   Формат очікується такий:
   {
     "albums": [
       {
         "name": "Варіанти пісні",
         "tracks": [
           { "title": "Варіант 1", "src": "tracks/variant1.mp3", "duration": 185 },
           { "title": "Варіант 2", "src": "tracks/variant2.mp3", "duration": 190 }
         ]
       }
     ]
   }
   Адмін-сторінка (окремий файл) буде записувати саме цей
   файл через GitHub API. Поки albums.json відсутній —
   показуємо приклад-заглушку нижче.
   ========================================================= */

const FALLBACK_DATA = {
  albums: [
    {
      name: "Варіанти пісні",
      tracks: [
        { title: "Варіант 1", src: "", duration: 185 },
        { title: "Варіант 2", src: "", duration: 190 },
        { title: "Варіант 3", src: "", duration: 178 }
      ]
    }
  ]
};

let library = null;
let currentAlbumIdx = 0;
let currentTrackIdx = 0;
let isPlaying = false;

const audioEl = document.getElementById('audio-el');
const albumsContainer = document.getElementById('albums-container');
const trackCountEl = document.getElementById('track-count');
const albumsMetaEl = document.getElementById('albums-meta');
const nowTitle = document.getElementById('now-title');
const nowSub = document.getElementById('now-sub');
const playBtn = document.getElementById('play-btn');
const playIcon = document.getElementById('play-icon');
const scrubTrack = document.getElementById('scrub-track');
const scrubFill = document.getElementById('scrub-fill');
const timeCurrent = document.getElementById('time-current');
const timeTotal = document.getElementById('time-total');
const vuMeter = document.getElementById('vu-meter');

const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE = '<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>';

/* Build VU meter bars */
const VU_BARS = 22;
for (let i = 0; i < VU_BARS; i++){
  const bar = document.createElement('span');
  vuMeter.appendChild(bar);
}
const vuBars = vuMeter.querySelectorAll('span');

function formatTime(sec){
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function renderAlbums(){
  albumsContainer.innerHTML = '';

  if (!library.albums || library.albums.length === 0){
    albumsContainer.innerHTML = '<div class="empty-state">Ще немає альбомів. Додай перший через адмін-сторінку.</div>';
    trackCountEl.textContent = '0 треків';
    albumsMetaEl.textContent = '0 альбомів';
    return;
  }

  let totalTracks = 0;
  library.albums.forEach(a => totalTracks += a.tracks.length);
  trackCountEl.textContent = `${totalTracks} ${pluralTracks(totalTracks)}`;
  albumsMetaEl.textContent = `${library.albums.length} ${pluralAlbums(library.albums.length)}`;

  library.albums.forEach((album, aIdx) => {
    const card = document.createElement('div');
    card.className = 'album-card';
    card.innerHTML = `
      <div class="album-cover">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div class="album-name">${escapeHtml(album.name)}</div>
      <div class="album-count">${album.tracks.length} ${pluralTracks(album.tracks.length)}</div>
    `;

    const list = document.createElement('div');
    list.className = 'tracklist';
    album.tracks.forEach((track, tIdx) => {
      const row = document.createElement('div');
      row.className = 'track-row';
      row.innerHTML = `<span>${escapeHtml(track.title)}</span><span class="dur">${formatTime(track.duration || 0)}</span>`;
      row.addEventListener('click', (e) => {
        e.stopPropagation();
        loadTrack(aIdx, tIdx);
        playAudio();
      });
      list.appendChild(row);
    });

    card.addEventListener('click', () => {
      const wasOpen = list.classList.contains('open');
      document.querySelectorAll('.tracklist.open').forEach(el => el.classList.remove('open'));
      if (!wasOpen) list.classList.add('open');
    });

    albumsContainer.appendChild(card);
    albumsContainer.appendChild(list);
  });
}

function pluralTracks(n){
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return 'трек';
  if ([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return 'треки';
  return 'треків';
}
function pluralAlbums(n){
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return 'альбом';
  if ([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return 'альбоми';
  return 'альбомів';
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function loadTrack(albumIdx, trackIdx){
  currentAlbumIdx = albumIdx;
  currentTrackIdx = trackIdx;
  const album = library.albums[albumIdx];
  const track = album.tracks[trackIdx];

  nowTitle.textContent = track.title;
  nowSub.textContent = album.name;
  timeTotal.textContent = formatTime(track.duration || 0);

  if (track.src){
    audioEl.src = track.src;
  } else {
    audioEl.removeAttribute('src');
  }

  document.querySelectorAll('.track-row').forEach(r => r.classList.remove('playing'));
  const openList = document.querySelectorAll('.tracklist')[albumIdx];
  if (openList) openList.children[trackIdx]?.classList.add('playing');
}

function playAudio(){
  if (!audioEl.src){
    // Демо-режим без реального файлу: просто анімуємо стан кнопки.
    isPlaying = true;
    playIcon.innerHTML = ICON_PAUSE;
    return;
  }
  audioEl.play();
}

function pauseAudio(){
  isPlaying = false;
  playIcon.innerHTML = ICON_PLAY;
  if (audioEl.src) audioEl.pause();
}

playBtn.addEventListener('click', () => {
  if (isPlaying) pauseAudio();
  else playAudio();
});

audioEl.addEventListener('play', () => {
  isPlaying = true;
  playIcon.innerHTML = ICON_PAUSE;
});
audioEl.addEventListener('pause', () => {
  isPlaying = false;
  playIcon.innerHTML = ICON_PLAY;
});
audioEl.addEventListener('timeupdate', () => {
  timeCurrent.textContent = formatTime(audioEl.currentTime);
  if (audioEl.duration){
    scrubFill.style.width = (audioEl.currentTime / audioEl.duration * 100) + '%';
  }
});
audioEl.addEventListener('loadedmetadata', () => {
  timeTotal.textContent = formatTime(audioEl.duration);
});
audioEl.addEventListener('ended', () => {
  goNext();
});

scrubTrack.addEventListener('click', (e) => {
  if (!audioEl.duration) return;
  const rect = scrubTrack.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  audioEl.currentTime = ratio * audioEl.duration;
});

function goNext(){
  const album = library.albums[currentAlbumIdx];
  if (currentTrackIdx < album.tracks.length - 1){
    loadTrack(currentAlbumIdx, currentTrackIdx + 1);
  } else if (currentAlbumIdx < library.albums.length - 1){
    loadTrack(currentAlbumIdx + 1, 0);
  } else {
    loadTrack(0, 0);
  }
  playAudio();
}

function goPrev(){
  if (currentTrackIdx > 0){
    loadTrack(currentAlbumIdx, currentTrackIdx - 1);
  } else if (currentAlbumIdx > 0){
    const prevAlbum = library.albums[currentAlbumIdx - 1];
    loadTrack(currentAlbumIdx - 1, prevAlbum.tracks.length - 1);
  }
  playAudio();
}

document.getElementById('next-btn').addEventListener('click', goNext);
document.getElementById('prev-btn').addEventListener('click', goPrev);

/* VU meter animation — reacts to real audio when Web Audio API
   graph is available, otherwise gently idles so the deck doesn't
   look dead while nothing plays. */
let audioCtx, analyser, dataArray, sourceNode;

function setupAnalyser(){
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 64;
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  sourceNode = audioCtx.createMediaElementSource(audioEl);
  sourceNode.connect(analyser);
  analyser.connect(audioCtx.destination);
}

audioEl.addEventListener('play', () => {
  try { setupAnalyser(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
  catch(e){ /* already connected or unsupported */ }
});

function animateVu(){
  requestAnimationFrame(animateVu);

  if (isPlaying && analyser){
    analyser.getByteFrequencyData(dataArray);
    vuBars.forEach((bar, i) => {
      const val = dataArray[i % dataArray.length] || 0;
      const pct = Math.max(10, (val / 255) * 100);
      bar.style.height = pct + '%';
      bar.classList.toggle('active', pct > 45);
    });
  } else if (isPlaying){
    // demo mode: no real audio graph, gentle fake motion
    vuBars.forEach((bar) => {
      const pct = 15 + Math.random() * 70;
      bar.style.height = pct + '%';
      bar.classList.toggle('active', pct > 45);
    });
  } else {
    vuBars.forEach((bar) => {
      bar.style.height = '10%';
      bar.classList.remove('active');
    });
  }
}
animateVu();

/* Load data */
async function init(){
  try {
    const res = await fetch('albums.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('no albums.json');
    library = await res.json();
  } catch(e){
    library = FALLBACK_DATA;
  }
  renderAlbums();
  if (library.albums && library.albums.length){
    loadTrack(0, 0);
  }
}
init();
</script>

</body>
</html>
