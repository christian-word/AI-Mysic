<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Music Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;300;400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg0:   #0f0a04;
    --bg1:   #1a1005;
    --ink:   #f5ede0;
    --muted: rgba(245,237,224,0.38);
    --border: rgba(245,237,224,0.08);

    /* warm amber / copper / gold palette */
    --c0: #f59e0b; --c0p: rgba(245,158,11,0.15);
    --c1: #ea8c34; --c1p: rgba(234,140,52,0.14);
    --c2: #d97706; --c2p: rgba(217,119,6,0.14);
    --c3: #f97316; --c3p: rgba(249,115,22,0.13);
    --c4: #fbbf24; --c4p: rgba(251,191,36,0.13);
    --c5: #b45309; --c5p: rgba(180,83,9,0.14);
    --c6: #e07b39; --c6p: rgba(224,123,57,0.13);
  }

  #stars-canvas {
    position: fixed; inset: 0;
    z-index: 0; pointer-events: none;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg0);
    min-height: 100vh;
    padding: 18px 10px 32px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    position: relative;
    overflow-x: hidden;
  }

  /* Warm nebula */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 65% 45% at 15% 20%,  rgba(245,158,11,0.10)  0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 88% 12%,  rgba(249,115,22,0.08)  0%, transparent 55%),
      radial-gradient(ellipse 55% 40% at 65% 82%,  rgba(217,119,6,0.07)   0%, transparent 55%),
      radial-gradient(ellipse 40% 35% at 18% 88%,  rgba(251,191,36,0.06)  0%, transparent 50%);
    pointer-events: none;
  }

  .page-wrap {
    width: 100%; max-width: 780px;
    position: relative; z-index: 1;
  }

  /* ── Header ── */
  .page-header {
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    text-align: center;
    position: relative;
  }

  .album-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(245,158,11,0.10);
    border: 1px solid rgba(245,158,11,0.28);
    border-radius: 20px;
    padding: 3px 12px;
    font-family: 'Josefin Sans', sans-serif;
    font-size: 9px; font-weight: 300;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--c0); margin-bottom: 12px;
  }
  .album-badge i { font-size: 8px; opacity: 0.8; }

  .page-header h1 {
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 100; font-size: 2rem;
    color: var(--ink);
    letter-spacing: 6px; text-transform: uppercase;
    line-height: 1.2; margin-bottom: 6px;
  }
  .page-header h1 span {
    display: block; font-weight: 300; font-size: 1rem;
    letter-spacing: 8px; color: var(--c0);
    opacity: 0.85; margin-top: 2px;
  }
  .page-header p {
    font-size: 10.5px; color: var(--muted);
    font-weight: 300; letter-spacing: 1px;
  }

  .star-divider {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin: 10px 0 0;
    color: var(--muted); font-size: 6px; letter-spacing: 6px;
  }
  .star-divider::before, .star-divider::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(245,158,11,0.45), transparent);
  }

  /* ── Track Card ── */
  .track-card {
    background: rgba(26,16,5,0.75);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 11px 13px;
    margin-bottom: 8px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    position: relative; overflow: hidden;
  }
  .track-card::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--ca, rgba(245,158,11,0.4)), transparent);
    opacity: 0; transition: opacity 0.3s;
  }
  .track-card:hover::before, .track-card.playing::before { opacity: 1; }
  .track-card:hover {
    background: rgba(32,20,6,0.88);
    transform: translateY(-1px);
    box-shadow: 0 10px 32px rgba(0,0,0,0.5);
  }
  .track-card.playing {
    border-color: var(--ca);
    background: rgba(32,20,6,0.92);
    box-shadow: 0 0 0 1px var(--ca), 0 0 24px var(--cg), 0 10px 32px rgba(0,0,0,0.5);
  }

  .track-card.c0 { --ca: var(--c0); --cg: var(--c0p); }
  .track-card.c1 { --ca: var(--c1); --cg: var(--c1p); }
  .track-card.c2 { --ca: var(--c2); --cg: var(--c2p); }
  .track-card.c3 { --ca: var(--c3); --cg: var(--c3p); }
  .track-card.c4 { --ca: var(--c4); --cg: var(--c4p); }
  .track-card.c5 { --ca: var(--c5); --cg: var(--c5p); }
  .track-card.c6 { --ca: var(--c6); --cg: var(--c6p); }

  .track-num {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 10px; font-weight: 300;
    letter-spacing: 1px;
    color: var(--ca, var(--muted));
    opacity: 0.6; margin-bottom: 8px; padding-left: 1px;
  }

  .track-top { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }

  .track-cover {
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 15px; color: white;
    position: relative; overflow: hidden;
  }
  .track-cover::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
  }
  .c0 .track-cover { background: linear-gradient(145deg, #b45309, #f59e0b); box-shadow: 0 3px 12px rgba(245,158,11,0.45); }
  .c1 .track-cover { background: linear-gradient(145deg, #c2600a, #ea8c34); box-shadow: 0 3px 12px rgba(234,140,52,0.42); }
  .c2 .track-cover { background: linear-gradient(145deg, #92400e, #d97706); box-shadow: 0 3px 12px rgba(217,119,6,0.42); }
  .c3 .track-cover { background: linear-gradient(145deg, #c2410c, #f97316); box-shadow: 0 3px 12px rgba(249,115,22,0.42); }
  .c4 .track-cover { background: linear-gradient(145deg, #d97706, #fbbf24); box-shadow: 0 3px 12px rgba(251,191,36,0.42); }
  .c5 .track-cover { background: linear-gradient(145deg, #7c2d12, #b45309); box-shadow: 0 3px 12px rgba(180,83,9,0.42); }
  .c6 .track-cover { background: linear-gradient(145deg, #9a3412, #e07b39); box-shadow: 0 3px 12px rgba(224,123,57,0.42); }

  .track-info { flex: 1; min-width: 0; }
  .track-title {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 0.82rem; font-weight: 300;
    color: var(--ink); margin-bottom: 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    letter-spacing: 0.5px;
  }
  .track-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .badge {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 1px 8px; border-radius: 20px;
    font-size: 8.5px; font-weight: 400;
    letter-spacing: 0.8px; text-transform: uppercase;
    border: 1px solid;
    font-family: 'Josefin Sans', sans-serif;
  }
  .c0 .badge { color: var(--c0); border-color: rgba(245,158,11,0.32); background: rgba(245,158,11,0.08); }
  .c1 .badge { color: var(--c1); border-color: rgba(234,140,52,0.30); background: rgba(234,140,52,0.07); }
  .c2 .badge { color: var(--c2); border-color: rgba(217,119,6,0.30);  background: rgba(217,119,6,0.07); }
  .c3 .badge { color: var(--c3); border-color: rgba(249,115,22,0.30); background: rgba(249,115,22,0.07); }
  .c4 .badge { color: var(--c4); border-color: rgba(251,191,36,0.30); background: rgba(251,191,36,0.07); }
  .c5 .badge { color: var(--c5); border-color: rgba(180,83,9,0.30);   background: rgba(180,83,9,0.07); }
  .c6 .badge { color: var(--c6); border-color: rgba(224,123,57,0.30); background: rgba(224,123,57,0.07); }

  .track-label { font-size: 10px; color: var(--muted); font-weight: 300; }

  .play-btn {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1.5px solid; background: transparent;
    font-size: 10px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s ease; flex-shrink: 0;
  }
  .play-btn .fa-play { margin-left: 2px; }
  .c0 .play-btn { border-color: var(--c0); color: var(--c0); }
  .c1 .play-btn { border-color: var(--c1); color: var(--c1); }
  .c2 .play-btn { border-color: var(--c2); color: var(--c2); }
  .c3 .play-btn { border-color: var(--c3); color: var(--c3); }
  .c4 .play-btn { border-color: var(--c4); color: var(--c4); }
  .c5 .play-btn { border-color: var(--c5); color: var(--c5); }
  .c6 .play-btn { border-color: var(--c6); color: var(--c6); }
  .c0 .play-btn:hover, .c0.playing .play-btn { background: var(--c0); color: #0f0a04; box-shadow: 0 0 14px var(--c0); transform: scale(1.08); }
  .c1 .play-btn:hover, .c1.playing .play-btn { background: var(--c1); color: #0f0a04; box-shadow: 0 0 14px var(--c1); transform: scale(1.08); }
  .c2 .play-btn:hover, .c2.playing .play-btn { background: var(--c2); color: #0f0a04; box-shadow: 0 0 14px var(--c2); transform: scale(1.08); }
  .c3 .play-btn:hover, .c3.playing .play-btn { background: var(--c3); color: #0f0a04; box-shadow: 0 0 14px var(--c3); transform: scale(1.08); }
  .c4 .play-btn:hover, .c4.playing .play-btn { background: var(--c4); color: #0f0a04; box-shadow: 0 0 14px var(--c4); transform: scale(1.08); }
  .c5 .play-btn:hover, .c5.playing .play-btn { background: var(--c5); color: #fff;    box-shadow: 0 0 14px var(--c5); transform: scale(1.08); }
  .c6 .play-btn:hover, .c6.playing .play-btn { background: var(--c6); color: #0f0a04; box-shadow: 0 0 14px var(--c6); transform: scale(1.08); }

  .wave-wrap {
    position: relative;
    background: rgba(245,237,224,0.03);
    border-radius: 8px; height: 44px;
    cursor: pointer; overflow: hidden;
  }
  .wave-inner { height: 44px; }
  .time-label {
    position: absolute; bottom: 4px; right: 7px;
    font-size: 9px; font-family: monospace;
    color: var(--muted); opacity: 0.5;
    pointer-events: none; z-index: 10;
  }
  .cur-label {
    position: absolute; bottom: 4px; left: 7px;
    font-size: 9px; font-family: monospace;
    pointer-events: none; z-index: 10;
  }
  .c0 .cur-label { color: var(--c0); }
  .c1 .cur-label { color: var(--c1); }
  .c2 .cur-label { color: var(--c2); }
  .c3 .cur-label { color: var(--c3); }
  .c4 .cur-label { color: var(--c4); }
  .c5 .cur-label { color: var(--c5); }
  .c6 .cur-label { color: var(--c6); }

  @keyframes orbit-glow {
    0%   { box-shadow: 0 0 0 0   var(--ca, var(--c0)); opacity: 1; }
    70%  { box-shadow: 0 0 0 10px transparent; opacity: 0; }
    100% { box-shadow: 0 0 0 0   transparent; opacity: 0; }
  }
  .track-card.playing .track-cover { animation: orbit-glow 2.2s ease infinite; }

  .page-footer {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px;
    margin-top: 8px; padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .footer-actions { display: flex; gap: 7px; }
  .action-btn {
    background: rgba(245,237,224,0.05);
    border: 1px solid var(--border);
    padding: 5px 12px; border-radius: 8px;
    font-size: 11px; color: rgba(245,237,224,0.65);
    cursor: pointer; transition: 0.2s;
    display: flex; align-items: center; gap: 5px;
    font-family: 'DM Sans', sans-serif;
  }
  .action-btn:hover {
    background: rgba(245,158,11,0.15);
    color: var(--c0);
    border-color: rgba(245,158,11,0.35);
  }

  .brand-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
  .brand-icon {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, #b45309, #f59e0b);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 12px rgba(245,158,11,0.35);
  }
  .brand-icon i { font-size: 12px; color: #0f0a04; }
  .brand-text {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 12px; font-weight: 300;
    color: var(--ink); letter-spacing: 3px; text-transform: uppercase;
  }
  .brand-sub { font-size: 9px; color: var(--muted); display: block; line-height: 1; letter-spacing: 2px; text-transform: uppercase; }

  .toast {
    position: fixed; top: 18px; left: 50%;
    transform: translateX(-50%) translateY(-12px);
    background: rgba(26,16,5,0.95);
    border: 1px solid rgba(245,158,11,0.35);
    color: var(--c0);
    padding: 9px 20px; border-radius: 30px;
    font-size: 12px; opacity: 0; visibility: hidden;
    transition: 0.3s; z-index: 1000;
    font-family: 'DM Sans', sans-serif;
    backdrop-filter: blur(12px);
  }
  .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<canvas id="stars-canvas"></canvas>
<div id="toast" class="toast">✦ Посилання скопійовано</div>

<div class="page-wrap">
  <div class="page-header">
    <div class="album-badge"><i class="fas fa-microchip"></i> AI Music Collection</div>
    <h1>AI Music<span>Collection</span></h1>
    <p>1 трек · AI Generated · Instrumental</p>
    <div class="star-divider">✦ ✦ ✦</div>
  </div>

  <!-- Track 1 -->
  <div class="track-card c0" id="card-0">
    <div class="track-num">01</div>
    <div class="track-top">
      <div class="track-cover"><i class="fas fa-microchip"></i></div>
      <div class="track-info">
        <div class="track-title">AI Music Collection</div>
        <div class="track-meta">
          <span class="badge"><i class="fas fa-wand-sparkles" style="font-size:7px"></i> AI Generated</span>
          <span class="track-label">Instrumental · Collection</span>
        </div>
      </div>
      <button class="play-btn" id="btn-0" onclick="togglePlay(0)"><i class="fas fa-play"></i></button>
    </div>
    <div class="wave-wrap">
      <div id="wave-0" class="wave-inner"></div>
      <span class="cur-label" id="cur-0">00:00</span>
      <span class="time-label" id="dur-0">--:--</span>
    </div>
  </div>

  <div class="page-footer">
    <div class="footer-actions">
      <button class="action-btn" onclick="shareTG()"><i class="fab fa-telegram-plane"></i> Telegram</button>
      <button class="action-btn" onclick="copyLink()"><i class="fas fa-link"></i> Посилання</button>
    </div>
    <div class="brand-logo">
      <div class="brand-icon"><i class="fas fa-music"></i></div>
      <div>
        <span class="brand-text">Мелодія</span>
        <span class="brand-sub">christian music</span>
      </div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('stars-canvas');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  function initStars() {
    stars = [];
    const n = Math.floor((canvas.width * canvas.height) / 5000);
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.2 + 0.2,
        a: Math.random(),
        da: (Math.random() - 0.5) * 0.004,
        color: ['#f5ede0','#f59e0b','#fbbf24','#ea8c34'][Math.floor(Math.random()*4)]
      });
    }
  }
  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.a += s.da;
      if (s.a <= 0 || s.a >= 1) s.da *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = s.color;
      ctx.globalAlpha = s.a * 0.75;
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(drawStars);
  }
  window.addEventListener('resize', () => { resize(); initStars(); });
  resize(); initStars(); drawStars();
</script>

<script type="module">
  import WaveSurfer from 'https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.esm.js';

  const tracks = [
    { src: 'AI-Musi-Collection.m4a' }
  ];

  const colors = [
    { wave: '#3d2604', progress: '#f59e0b' }
  ];

  const fmt = s => new Date(s * 1000).toISOString().substr(14, 5);

  const players = tracks.map((track, i) => {
    const ws = WaveSurfer.create({
      container: `#wave-${i}`,
      waveColor: colors[i].wave,
      progressColor: colors[i].progress,
      barWidth: 2,
      barGap: 0.5,
      barRadius: 1,
      height: 44,
      url: track.src,
    });

    const btn = document.getElementById(`btn-${i}`);

    ws.on('ready',      (dur) => document.getElementById(`dur-${i}`).textContent = fmt(dur));
    ws.on('timeupdate', (cur) => document.getElementById(`cur-${i}`).textContent = fmt(cur));

    ws.on('play', () => {
      btn.innerHTML = '<i class="fas fa-pause"></i>';
      document.getElementById(`card-${i}`).classList.add('playing');
    });
    ws.on('pause', () => {
      btn.innerHTML = '<i class="fas fa-play"></i>';
      document.getElementById(`card-${i}`).classList.remove('playing');
    });

    return ws;
  });

  window.togglePlay = (i) => players[i].playPause();

  window.shareTG = () =>
    window.open(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}`, '_blank');

  window.copyLink = () =>
    navigator.clipboard.writeText(window.location.href).then(() => {
      const t = document.getElementById('toast');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    });
</script>
</body>
</html>
