<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0d0d0f;font-family:'Inter',system-ui,sans-serif;color:#e8e8f0;min-height:100vh}
#app{max-width:420px;margin:0 auto;padding:20px 16px 32px}

/* Header */
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#5b4fcf,#8b7cf8);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 16px rgba(91,79,207,.4)}
.logo i{font-size:20px;color:#fff}
.logo-text h1{font-size:16px;font-weight:600;color:#f0f0f8;letter-spacing:-.2px}
.logo-text a{font-size:11px;color:#5b4fcf;text-decoration:none;letter-spacing:.2px}
.logo-text a:hover{color:#8b7cf8}

/* Now playing card */
.card{background:#141417;border:1px solid #1e1e26;border-radius:20px;padding:20px;margin-bottom:16px}

.np{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.art{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#1e1a40,#2e2860);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.art i{font-size:24px;color:#8b7cf8}
.np-info{flex:1;min-width:0}
.np-title{font-size:15px;font-weight:600;color:#f0f0f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px;letter-spacing:-.2px}
.np-idle{color:#44445a;font-weight:400}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:5px;font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.t-mp3{background:#0d2e1a;color:#2ecc80}
.t-opus{background:#2e1e00;color:#e09030}
.t-m4a,.t-m4p{background:#2e0e0e;color:#e06060}
.t-def{background:#1e1a40;color:#8b7cf8}

/* Progress */
.prog-area{margin-bottom:18px}
.prog-bg{height:5px;background:#1e1e26;border-radius:10px;cursor:pointer;position:relative;overflow:hidden}
.prog-bg:hover{background:#25252e}
.prog-fill{height:100%;background:linear-gradient(90deg,#5b4fcf,#8b7cf8);border-radius:10px;width:0%;pointer-events:none;transition:width .08s linear}
.times{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:#44445a;letter-spacing:.2px}

/* Controls */
.ctrls{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:18px}
.btn-side{width:42px;height:42px;border-radius:12px;background:#1a1a22;border:1px solid #25252e;cursor:pointer;color:#9090b0;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.btn-side:hover{background:#22222c;border-color:#32323e;color:#e0e0f0;transform:scale(1.04)}
.btn-side:active{transform:scale(.95)}
.btn-side i{font-size:19px}
.btn-play{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#5b4fcf,#8b7cf8);border:none;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(91,79,207,.45);transition:all .15s}
.btn-play:hover{transform:scale(1.06);box-shadow:0 6px 24px rgba(91,79,207,.6)}
.btn-play:active{transform:scale(.95)}
.btn-play i{font-size:26px}

/* Volume */
.vol{display:flex;align-items:center;gap:10px}
.vol i{font-size:15px;color:#35354a;flex-shrink:0}
.vol input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;background:#1e1e26;border-radius:10px;outline:none;cursor:pointer}
.vol input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#8b7cf8;cursor:pointer;box-shadow:0 0 0 3px rgba(139,124,248,.2)}
.vol input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#8b7cf8;border:none;cursor:pointer}

/* Playlist */
.pl-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 2px}
.pl-cnt{font-size:12px;color:#44445a;letter-spacing:.2px}
.btn-shuf{font-size:11px;font-weight:500;background:#141417;border:1px solid #1e1e26;border-radius:8px;padding:5px 12px;color:#44445a;cursor:pointer;letter-spacing:.3px;transition:all .15s;font-family:'Inter',sans-serif}
.btn-shuf:hover{border-color:#2e2e3e;color:#9090b0}
.btn-shuf.on{color:#8b7cf8;border-color:#3d3680;background:#1a1830}

.pl-wrap{background:#141417;border:1px solid #1e1e26;border-radius:20px;overflow:hidden;max-height:360px;overflow-y:auto}
.pl-wrap::-webkit-scrollbar{width:3px}
.pl-wrap::-webkit-scrollbar-track{background:transparent}
.pl-wrap::-webkit-scrollbar-thumb{background:#25252e;border-radius:10px}

.tr{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;border-bottom:1px solid #1a1a22;transition:background .12s}
.tr:last-child{border-bottom:none}
.tr:hover{background:#181820}
.tr.active{background:#1a1838}
.tr-idx{font-size:11px;color:#35354a;width:16px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.tr.active .tr-idx{color:#8b7cf8}
.tr-name{flex:1;font-size:13px;font-weight:500;color:#a0a0c0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px}
.tr.active .tr-name{color:#d8d4ff}
.tr-tag{font-size:8px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;flex-shrink:0;padding:2px 6px;border-radius:4px}

.status{text-align:center;padding:32px 16px;color:#35354a;font-size:13px;line-height:2}
.status i{font-size:26px;display:block;margin-bottom:4px;color:#25252e}
.err{color:#8b3a3a}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="logo"><i class="ti ti-music"></i></div>
    <div class="logo-text">
      <h1>AI Mysic — Album</h1>
      <a href="https://github.com/christian-word/AI-Mysic/tree/main/PlayerWithSong/Album" target="_blank">christian-word / AI-Mysic ↗</a>
    </div>
  </div>

  <div class="card">
    <div class="np">
      <div class="art"><i class="ti ti-music-note"></i></div>
      <div class="np-info">
        <div class="np-title np-idle" id="tname">Виберіть трек</div>
        <span class="tag t-def" id="tbadge" style="display:none"></span>
      </div>
    </div>

    <div class="prog-area">
      <div class="prog-bg" id="progBg"><div class="prog-fill" id="progFill"></div></div>
      <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    </div>

    <div class="ctrls">
      <button class="btn-side" id="bPrev"><i class="ti ti-player-skip-back"></i></button>
      <button class="btn-play" id="bPlay"><i class="ti ti-player-play" id="pIco"></i></button>
      <button class="btn-side" id="bNext"><i class="ti ti-player-skip-forward"></i></button>
    </div>

    <div class="vol">
      <i class="ti ti-volume"></i>
      <input type="range" min="0" max="1" step="0.01" value="1" id="vol">
      <i class="ti ti-volume-3"></i>
    </div>
  </div>

  <div class="pl-bar">
    <span class="pl-cnt" id="plCnt">Завантаження...</span>
    <button class="btn-shuf" id="shuf">⇄ shuffle</button>
  </div>
  <div class="pl-wrap" id="plWrap">
    <div class="status"><i class="ti ti-loader"></i>Читаємо репозиторій...</div>
  </div>
</div>

<audio id="aud" preload="none"></audio>
<script>
const O='christian-word',R='AI-Mysic',P='PlayerWithSong/Album',B='main';
const API=`https://api.github.com/repos/${O}/${R}/contents/${P}?ref=${B}`;
const RAW=`https://raw.githubusercontent.com/${O}/${R}/${B}/${P}/`;
const EXTS=['mp3','opus','m4a','m4p','ogg','wav','flac','aac'];
let tracks=[],cur=-1,shufOn=false;
const aud=document.getElementById('aud');
const $=id=>document.getElementById(id);
const ext=n=>n.split('.').pop().toLowerCase();
const clean=n=>n.replace(/\.[^.]+$/,'').replace(/[-_]/g,' ');
const fmt=s=>{if(!s||isNaN(s))return'0:00';return`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`};
const tc=e=>({mp3:'t-mp3',opus:'t-opus',ogg:'t-opus',m4a:'t-m4a',m4p:'t-m4p'}[e]||'t-def');

function render(){
  if(!tracks.length){$('plWrap').innerHTML='<div class="status err"><i class="ti ti-alert-circle"></i>Файлів не знайдено</div>';return}
  $('plCnt').textContent=`${tracks.length} треків`;
  $('plWrap').innerHTML='';
  tracks.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='tr'+(i===cur?' active':'');
    const e=ext(t.name);
    d.innerHTML=`<span class="tr-idx">${i+1}</span><span class="tr-name">${clean(t.name)}</span><span class="tr-tag ${tc(e)}" style="background:${tagBg(e)};color:${tagFg(e)}">${e.toUpperCase()}</span>`;
    d.onclick=()=>load(i,true);
    $('plWrap').appendChild(d);
  });
}
function tagBg(e){return{mp3:'#0d2e1a',opus:'#2e1e00',m4a:'#2e0e0e',m4p:'#2e0e0e',ogg:'#2e1e00'}[e]||'#1e1a40'}
function tagFg(e){return{mp3:'#2ecc80',opus:'#e09030',m4a:'#e06060',m4p:'#e06060',ogg:'#e09030'}[e]||'#8b7cf8'}

function syncActive(){
  [...$('plWrap').children].forEach((r,i)=>{
    const on=i===cur;
    r.classList.toggle('active',on);
    r.querySelector('.tr-idx').textContent=on?'▶':i+1;
  });
  const row=$('plWrap').children[cur];
  if(row)row.scrollIntoView({block:'nearest'});
}
function load(i,play=false){
  if(i<0||i>=tracks.length)return;
  cur=i;const t=tracks[i],e=ext(t.name);
  const nm=$('tname');nm.textContent=clean(t.name);nm.classList.remove('np-idle');
  const b=$('tbadge');b.textContent=e.toUpperCase();b.className=`tag ${tc(e)}`;b.style.cssText=`display:inline-flex;background:${tagBg(e)};color:${tagFg(e)}`;
  $('progFill').style.width='0%';$('tCur').textContent='0:00';$('tDur').textContent='0:00';
  $('pIco').className='ti ti-player-play';
  aud.src=RAW+encodeURIComponent(t.name);aud.load();syncActive();
  if(play)aud.play().then(()=>$('pIco').className='ti ti-player-pause').catch(()=>{});
}
const nextI=()=>shufOn?Math.floor(Math.random()*tracks.length):(cur+1)%tracks.length;
const prevI=()=>(cur-1+tracks.length)%tracks.length;
$('bPlay').onclick=()=>{
  if(cur<0&&tracks.length){load(0,true);return}
  if(aud.paused)aud.play().then(()=>$('pIco').className='ti ti-player-pause').catch(()=>{});
  else{aud.pause();$('pIco').className='ti ti-player-play'}
};
$('bNext').onclick=()=>load(nextI(),cur>=0);
$('bPrev').onclick=()=>{if(aud.currentTime>3){aud.currentTime=0;return}load(prevI(),cur>=0)};
aud.ontimeupdate=()=>{if(aud.duration){$('progFill').style.width=(aud.currentTime/aud.duration*100)+'%';$('tCur').textContent=fmt(aud.currentTime)}};
aud.onloadedmetadata=()=>$('tDur').textContent=fmt(aud.duration);
aud.onplay=()=>$('pIco').className='ti ti-player-pause';
aud.onpause=()=>$('pIco').className='ti ti-player-play';
aud.onended=()=>load(nextI(),true);
$('progBg').onclick=ev=>{
  if(!aud.duration)return;
  const r=$('progBg').getBoundingClientRect();
  aud.currentTime=((ev.clientX-r.left)/r.width)*aud.duration;
};
$('vol').oninput=()=>aud.volume=$('vol').value;
$('shuf').onclick=()=>{shufOn=!shufOn;$('shuf').classList.toggle('on',shufOn);$('shuf').textContent=shufOn?'⇄ on':'⇄ shuffle'};
(async()=>{
  try{
    const res=await fetch(API,{headers:{Accept:'application/vnd.github.v3+json'}});
    if(!res.ok)throw new Error(`GitHub ${res.status}`);
    const data=await res.json();
    tracks=data.filter(f=>f.type==='file'&&EXTS.includes(ext(f.name)));
    tracks.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
    render();
  }catch(e){
    $('plWrap').innerHTML=`<div class="status err"><i class="ti ti-alert-circle"></i>${e.message}</div>`;
    $('plCnt').textContent='Помилка';
  }
})();
</script>
</body>
</html>
