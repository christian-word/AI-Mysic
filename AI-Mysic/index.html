<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Mysic — каталог пісень</title>

<!-- Заміни ДОМЕН на адресу свого сайту після публікації -->
<meta property="og:type" content="website">
<meta property="og:title" content="AI Mysic — каталог пісень">
<meta property="og:description" content="Пісні та їхні версії: ремікси, акустика, альтернативні зведення. З плеером і повними відео.">
<meta property="og:image" content="https://ДОМЕН/og-image.png">
<meta property="og:url" content="https://ДОМЕН/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="AI Mysic — каталог пісень">
<meta name="twitter:description" content="Пісні та їхні версії: ремікси, акустика, альтернативні зведення.">
<meta name="twitter:image" content="https://ДОМЕН/og-image.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#241019;
    --panel:#2f1522;
    --panel-hi:#3a1a2a;
    --gold:#cf9f5c;
    --gold-dim:#a9834e;
    --rose:#c97b84;
    --cream:#f1e6d9;
    --cream-dim:#cbb9ab;
    --line:rgba(241,230,217,0.14);
    --line-soft:rgba(241,230,217,0.07);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:'Work Sans',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  .wrap{max-width:980px;margin:0 auto;padding:56px 24px 120px;}

  /* ---------- шапка ---------- */
  header{
    display:flex;
    gap:40px;
    align-items:flex-end;
    padding-bottom:32px;
    border-bottom:1px solid var(--line);
    margin-bottom:8px;
  }
  .mark{flex:0 0 auto;width:96px;height:96px;}
  .head-text{flex:1;min-width:0;}
  h1{
    font-family:'Fraunces',Georgia,serif;
    font-weight:500;
    font-size:clamp(32px,5vw,48px);
    line-height:1.05;
    margin:0 0 12px;
  }
  .lede{
    color:var(--cream-dim);
    font-size:16px;
    line-height:1.55;
    max-width:56ch;
    margin:0;
  }

  /* ---------- панель керування ---------- */
  .controls{
    display:flex;
    gap:16px;
    align-items:center;
    flex-wrap:wrap;
    padding:20px 0 28px;
    border-bottom:1px solid var(--line);
    margin-bottom:36px;
  }
  .search{
    flex:1;
    min-width:200px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--cream);
    font-family:inherit;
    font-size:15px;
    padding:11px 16px;
  }
  .search::placeholder{color:var(--cream-dim);opacity:.7;}
  .search:focus{outline:none;border-color:var(--gold);}
  .count{
    color:var(--cream-dim);
    font-size:14px;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  /* ---------- картка пісні ---------- */
  .song{
    border-bottom:1px solid var(--line-soft);
    padding:28px 0;
  }
  .song:first-of-type{padding-top:0;}

  .song-head{
    display:flex;
    gap:22px;
    align-items:center;
    width:100%;
    background:none;
    border:none;
    padding:0;
    color:inherit;
    font:inherit;
    text-align:left;
    cursor:pointer;
  }
  .song-head:focus-visible{outline:2px solid var(--gold);outline-offset:6px;}

  .cover{
    flex:0 0 auto;
    width:84px;height:84px;
    object-fit:cover;
    background:var(--panel-hi);
    border:1px solid var(--line-soft);
  }
  .cover-ph{
    flex:0 0 auto;
    width:84px;height:84px;
    background:var(--panel-hi);
    border:1px solid var(--line-soft);
    display:flex;align-items:center;justify-content:center;
  }
  .cover-ph svg{width:34px;height:34px;opacity:.55;}

  .song-info{flex:1;min-width:0;}
  .song-title{
    font-family:'Fraunces',Georgia,serif;
    font-size:24px;
    font-weight:500;
    margin:0 0 6px;
    line-height:1.2;
  }
  .song-meta{
    color:var(--cream-dim);
    font-size:14px;
    margin:0;
  }
  .song-note{
    color:var(--cream-dim);
    font-size:14px;
    margin:6px 0 0;
    line-height:1.5;
    max-width:58ch;
  }

  .chev{
    flex:0 0 auto;
    width:22px;height:22px;
    color:var(--gold-dim);
    transition:transform .2s ease;
  }
  .song.open .chev{transform:rotate(180deg);}

  /* ---------- версії ---------- */
  .versions{
    display:none;
    margin:22px 0 0 106px;
    border-left:1px solid var(--line-soft);
    padding-left:26px;
  }
  .song.open .versions{display:block;}
  .song.single .versions{display:block;margin-top:20px;}
  .song.single .song-head{cursor:default;}
  .song.single .chev{display:none;}

  .version{
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:20px;
    align-items:center;
    padding:15px 0;
  }
  .version + .version{border-top:1px solid var(--line-soft);}

  .playbtn{
    width:46px;height:46px;
    border-radius:50%;
    border:1.4px solid var(--gold);
    background:transparent;
    color:var(--gold);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:background .15s ease,color .15s ease;
  }
  .playbtn:hover,.playbtn.playing{background:var(--gold);color:var(--bg);}
  .playbtn:focus-visible{outline:2px solid var(--cream);outline-offset:3px;}
  .playbtn svg{width:16px;height:16px;}

  .v-body{min-width:0;}
  .v-name{
    font-size:16px;
    font-weight:500;
    margin:0 0 9px;
  }
  .scrub{display:flex;align-items:center;gap:11px;}
  .t{
    font-variant-numeric:tabular-nums;
    font-size:12.5px;
    color:var(--cream-dim);
    width:36px;
    flex-shrink:0;
  }
  .t.end{text-align:right;}

  .bar{
    position:relative;
    flex:1;
    height:20px;
    display:flex;align-items:center;
    cursor:pointer;
  }
  .bar-bg,.bar-fill{position:absolute;left:0;height:2px;}
  .bar-bg{right:0;background:var(--line);}
  .bar-fill{width:0;background:var(--gold);}
  .knob{
    position:absolute;left:0;
    width:8px;height:8px;border-radius:50%;
    background:var(--gold);
    transform:translateX(-50%);
  }

  .yt{
    flex-shrink:0;
    display:inline-flex;align-items:center;gap:7px;
    text-decoration:none;
    color:var(--cream-dim);
    font-size:13.5px;
    border:1px solid var(--line);
    padding:9px 14px;
    white-space:nowrap;
    transition:border-color .15s ease,color .15s ease;
  }
  .yt:hover{border-color:var(--gold);color:var(--gold);}
  .yt:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .yt svg{width:15px;height:15px;flex-shrink:0;}

  /* ---------- підвал ---------- */
  footer{
    margin-top:48px;
    padding-top:28px;
    border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
    gap:20px;flex-wrap:wrap;
  }
  footer p{margin:0;color:var(--cream-dim);font-size:14px;max-width:44ch;}

  .state{
    padding:48px 0;
    color:var(--cream-dim);
    font-size:15px;
    line-height:1.6;
  }
  .state code{
    background:var(--panel);
    padding:2px 7px;
    font-size:13.5px;
  }

  @media (max-width:680px){
    header{flex-direction:column;align-items:flex-start;gap:20px;}
    .mark{width:70px;height:70px;}
    .cover,.cover-ph{width:64px;height:64px;}
    .song-head{gap:16px;}
    .song-title{font-size:20px;}
    .versions{margin-left:0;padding-left:16px;}
    .version{grid-template-columns:auto 1fr;row-gap:14px;}
    .yt{grid-column:1 / -1;justify-content:center;}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <svg class="mark" viewBox="0 0 112 112" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="56" cy="56" r="54" stroke="var(--gold-dim)" stroke-width="1"/>
      <path d="M56 20 C40 40, 40 62, 56 92 C72 62, 72 40, 56 20 Z" stroke="var(--gold)" stroke-width="1.5" fill="none"/>
      <path d="M56 36 C48 48, 48 62, 56 80 C64 62, 64 48, 56 36 Z" stroke="var(--rose)" stroke-width="1.2" fill="none"/>
      <circle cx="56" cy="56" r="3" fill="var(--gold)"/>
    </svg>
    <div class="head-text">
      <h1 id="cat-title">AI Mysic</h1>
      <p class="lede" id="cat-sub"></p>
    </div>
  </header>

  <div class="controls">
    <input class="search" id="search" type="search" placeholder="Знайти пісню за назвою" autocomplete="off" aria-label="Пошук пісні">
    <span class="count" id="count"></span>
  </div>

  <main id="list">
    <div class="state" id="state">Завантаження каталогу…</div>
  </main>

  <footer>
    <p>Повні відео всіх пісень зібрані у плейлисті на YouTube.</p>
    <a class="yt" id="playlist-link" href="#" target="_blank" rel="noopener" hidden>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2c-.2-1-1-1.7-2-1.9C17.9 5 12 5 12 5s-5.9 0-7.6.3c-1 .2-1.8.9-2 1.9C2 9 2 12 2 12s0 3 .4 4.8c.2 1 1 1.7 2 1.9C6.1 19 12 19 12 19s5.9 0 7.6-.3c1-.2 1.8-.9 2-1.9.4-1.8.4-4.8.4-4.8s0-3-.4-4.8zM10 15V9l5.2 3-5.2 3z"/></svg>
      Весь плейлист
    </a>
  </footer>

</div>

<script>
(function(){
  'use strict';

  var ICON_PLAY  = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  var ICON_YT    = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2c-.2-1-1-1.7-2-1.9C17.9 5 12 5 12 5s-5.9 0-7.6.3c-1 .2-1.8.9-2 1.9C2 9 2 12 2 12s0 3 .4 4.8c.2 1 1 1.7 2 1.9C6.1 19 12 19 12 19s5.9 0 7.6-.3c1-.2 1.8-.9 2-1.9.4-1.8.4-4.8.4-4.8s0-3-.4-4.8zM10 15V9l5.2 3-5.2 3z"/></svg>';
  var ICON_NOTE  = '<svg viewBox="0 0 24 24" fill="none" stroke="var(--gold-dim)" stroke-width="1.4"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>';
  var ICON_CHEV  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 9l6 6 6-6"/></svg>';

  // єдиний аудіо-рушій: грає завжди тільки одна версія
  var audio = new Audio();
  audio.preload = 'none';
  var activeUI = null;

  function fmt(s){
    if(!isFinite(s) || s < 0) return '0:00';
    var m = Math.floor(s/60), x = Math.floor(s%60);
    return m + ':' + (x<10?'0':'') + x;
  }

  function plural(n){
    var d = n % 10, h = n % 100;
    if(d === 1 && h !== 11) return n + ' версія';
    if(d >= 2 && d <= 4 && (h < 12 || h > 14)) return n + ' версії';
    return n + ' версій';
  }

  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }

  function stopActive(){
    if(activeUI){
      activeUI.btn.classList.remove('playing');
      activeUI.btn.innerHTML = ICON_PLAY;
    }
  }

  function buildVersion(v){
    var row = el('div','version');

    var btn = el('button','playbtn',ICON_PLAY);
    btn.type = 'button';
    btn.setAttribute('aria-label','Відтворити ' + (v.name || 'версію'));

    var body = el('div','v-body');
    var name = el('p','v-name', (v.name || 'Версія'));
    var scrub = el('div','scrub');
    var tCur = el('span','t cur','0:00');
    var bar  = el('div','bar','<div class="bar-bg"></div><div class="bar-fill"></div><div class="knob"></div>');
    var tEnd = el('span','t end','—:—');
    scrub.appendChild(tCur); scrub.appendChild(bar); scrub.appendChild(tEnd);
    body.appendChild(name); body.appendChild(scrub);

    var fill = bar.querySelector('.bar-fill');
    var knob = bar.querySelector('.knob');

    var ui = { btn:btn, fill:fill, knob:knob, tCur:tCur, tEnd:tEnd, src:v.file };

    btn.addEventListener('click', function(){
      var isThis = activeUI === ui;
      if(isThis && !audio.paused){
        audio.pause();
        btn.classList.remove('playing');
        btn.innerHTML = ICON_PLAY;
        return;
      }
      if(!isThis){
        stopActive();
        activeUI = ui;
        audio.src = v.file;
        audio.load();
      }
      audio.play().then(function(){
        btn.classList.add('playing');
        btn.innerHTML = ICON_PAUSE;
      }).catch(function(){
        tEnd.textContent = 'файл не знайдено';
      });
    });

    bar.addEventListener('click', function(e){
      if(activeUI !== ui || !audio.duration) return;
      var r = bar.getBoundingClientRect();
      var pct = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      audio.currentTime = pct * audio.duration;
    });

    row.appendChild(btn);
    row.appendChild(body);

    if(v.youtube){
      var a = el('a','yt', ICON_YT + ' Повне відео');
      a.href = v.youtube;
      a.target = '_blank';
      a.rel = 'noopener';
      row.appendChild(a);
    } else {
      row.appendChild(el('span'));
    }

    return row;
  }

  function buildSong(song){
    var n = (song.versions || []).length;
    var wrap = el('article','song' + (n <= 1 ? ' single' : ''));

    var head = el('button','song-head');
    head.type = 'button';

    if(song.cover){
      var img = document.createElement('img');
      img.className = 'cover';
      img.src = song.cover;
      img.alt = '';
      img.loading = 'lazy';
      img.addEventListener('error', function(){
        var ph = el('div','cover-ph', ICON_NOTE);
        img.replaceWith(ph);
      });
      head.appendChild(img);
    } else {
      head.appendChild(el('div','cover-ph', ICON_NOTE));
    }

    var info = el('div','song-info');
    info.appendChild(el('h2','song-title', song.title || 'Без назви'));
    var metaBits = [];
    if(song.year) metaBits.push(song.year);
    metaBits.push(plural(n));
    info.appendChild(el('p','song-meta', metaBits.join(' — ')));
    if(song.note) info.appendChild(el('p','song-note', song.note));
    head.appendChild(info);

    if(n > 1) head.appendChild(el('span','chev', ICON_CHEV));

    var versions = el('div','versions');
    (song.versions || []).forEach(function(v){ versions.appendChild(buildVersion(v)); });

    if(n > 1){
      head.setAttribute('aria-expanded','false');
      head.addEventListener('click', function(){
        var open = wrap.classList.toggle('open');
        head.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    }

    wrap.appendChild(head);
    wrap.appendChild(versions);
    wrap._title = (song.title || '').toLowerCase();
    return wrap;
  }

  // ---- прогрес єдиного аудіо ----
  audio.addEventListener('timeupdate', function(){
    if(!activeUI || !audio.duration) return;
    var pct = (audio.currentTime / audio.duration) * 100;
    activeUI.fill.style.width = pct + '%';
    activeUI.knob.style.left = pct + '%';
    activeUI.tCur.textContent = fmt(audio.currentTime);
  });
  audio.addEventListener('loadedmetadata', function(){
    if(activeUI) activeUI.tEnd.textContent = fmt(audio.duration);
  });
  audio.addEventListener('ended', function(){ stopActive(); });
  audio.addEventListener('error', function(){
    if(activeUI){
      stopActive();
      activeUI.tEnd.textContent = 'файл не знайдено';
    }
  });

  // ---- завантаження каталогу ----
  var listEl = document.getElementById('list');
  var stateEl = document.getElementById('state');
  var countEl = document.getElementById('count');
  var searchEl = document.getElementById('search');
  var cards = [];

  function updateCount(){
    var shown = cards.filter(function(c){ return c.style.display !== 'none'; }).length;
    countEl.textContent = shown === cards.length
      ? plural2(cards.length)
      : shown + ' з ' + cards.length;
  }
  function plural2(n){
    var d = n % 10, h = n % 100;
    if(d === 1 && h !== 11) return n + ' пісня';
    if(d >= 2 && d <= 4 && (h < 12 || h > 14)) return n + ' пісні';
    return n + ' пісень';
  }

  searchEl.addEventListener('input', function(){
    var q = searchEl.value.trim().toLowerCase();
    cards.forEach(function(c){
      c.style.display = (!q || c._title.indexOf(q) !== -1) ? '' : 'none';
    });
    updateCount();
  });

  fetch('songs.json', {cache:'no-cache'})
    .then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data){
      if(data.title) document.getElementById('cat-title').textContent = data.title;
      if(data.subtitle) document.getElementById('cat-sub').textContent = data.subtitle;
      if(data.playlist){
        var pl = document.getElementById('playlist-link');
        pl.href = data.playlist;
        pl.hidden = false;
      }

      var songs = data.songs || [];
      stateEl.remove();

      if(!songs.length){
        listEl.appendChild(el('div','state','У каталозі поки немає пісень. Додай першу в <code>songs.json</code>.'));
        return;
      }

      songs.forEach(function(s){
        var card = buildSong(s);
        cards.push(card);
        listEl.appendChild(card);
      });
      updateCount();
    })
    .catch(function(err){
      stateEl.innerHTML = 'Не вдалося прочитати <code>songs.json</code>.<br>' +
        'Якщо сторінка відкрита як файл з диска — браузер блокує читання. ' +
        'Запусти локальний сервер або відкрий сторінку через GitHub Pages.<br><br>' +
        '<span style="opacity:.6">' + err.message + '</span>';
    });
})();
</script>
</body>
</html>
