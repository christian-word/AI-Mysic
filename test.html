<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worship Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1c2030; --card: #242840; --ink: #ddd8f0;
    --muted: rgba(220,216,240,0.38); --border: rgba(255,255,255,0.09);
    --shadow: 0 4px 24px rgba(0,0,0,0.40);
    --c0:#6b9fd4; --c0-bg:#1e2d3d; --c0-dk:#3a6ea8;
    --c1:#5ab8a8; --c1-bg:#1a2d2a; --c1-dk:#2a8a7a;
    --c2:#8aaa60; --c2-bg:#1e2a18; --c2-dk:#5a7a3a;
    --c3:#7aa0b0; --c3-bg:#1a2530; --c3-dk:#4a6a7a;
    --c4:#b07cc0; --c4-bg:#2a1e35; --c4-dk:#7a4a8a;
    --c5:#d4aa60; --c5-bg:#2d2410; --c5-dk:#a07830;
    --c6:#c07850; --c6-bg:#2d1e10; --c6-dk:#8a4a2a;
    --c7:#5090b8; --c7-bg:#102030; --c7-dk:#2a5a7a;
  }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); min-height:100vh; padding:14px 10px 24px; display:flex; justify-content:center; align-items:flex-start; position:relative; overflow-x:hidden; }
  body::before { content:''; position:fixed; inset:0; background: radial-gradient(ellipse 60% 40% at 80% 10%,rgba(107,159,212,0.07) 0%,transparent 60%), radial-gradient(ellipse 50% 50% at 10% 80%,rgba(90,160,168,0.05) 0%,transparent 60%); pointer-events:none; }
  .page-wrap { width:100%; max-width:780px; position:relative; }
  .page-header { margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--border); }
  .header-eyebrow { font-size:10px; font-weight:500; letter-spacing:3px; text-transform:uppercase; color:#6b9fd4; margin-bottom:8px; }
  .page-header h1 { font-family:'Cormorant Garamond',serif; font-weight:300; font-size:1.7rem; color:var(--ink); letter-spacing:-0.5px; line-height:1.1; margin-bottom:4px; }
  .page-header p { font-size:11px; color:var(--muted); font-weight:300; }
  .state-msg { text-align:center; padding:60px 20px; color:var(--muted); font-size:14px; }
  .state-msg i { font-size:32px; margin-bottom:12px; display:block; opacity:0.4; }
  .track-card {
    background:var(--card); border:1px solid var(--border); border-radius:13px;
    padding:11px 13px; margin-bottom:9px; box-shadow:var(--shadow);
    transition:transform 0.2s ease,box-shadow 0.2s ease,border-color 0.2s ease;
    --accent:var(--c0); --accent-bg:var(--c0-bg); --accent-dk:var(--c0-dk);
  }
  .track-card:hover { transform:translateY(-1px); box-shadow:0 8px 32px rgba(0,0,0,0.5); }
  .track-card.playing { border-color:var(--accent); }
  .track-card.playing .track-cover { outline:2px solid var(--accent); outline-offset:2px; }
  .track-card[data-color="0"]{--accent:var(--c0);--accent-bg:var(--c0-bg);--accent-dk:var(--c0-dk)}
  .track-card[data-color="1"]{--accent:var(--c1);--accent-bg:var(--c1-bg);--accent-dk:var(--c1-dk)}
  .track-card[data-color="2"]{--accent:var(--c2);--accent-bg:var(--c2-bg);--accent-dk:var(--c2-dk)}
  .track-card[data-color="3"]{--accent:var(--c3);--accent-bg:var(--c3-bg);--accent-dk:var(--c3-dk)}
  .track-card[data-color="4"]{--accent:var(--c4);--accent-bg:var(--c4-bg);--accent-dk:var(--c4-dk)}
  .track-card[data-color="5"]{--accent:var(--c5);--accent-bg:var(--c5-bg);--accent-dk:var(--c5-dk)}
  .track-card[data-color="6"]{--accent:var(--c6);--accent-bg:var(--c6-bg);--accent-dk:var(--c6-dk)}
  .track-card[data-color="7"]{--accent:var(--c7);--accent-bg:var(--c7-bg);--accent-dk:var(--c7-dk)}
  .track-top { display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .track-cover { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:16px; color:white; position:relative; overflow:hidden; background:linear-gradient(145deg,var(--accent-dk),var(--accent)); box-shadow:0 4px 14px rgba(0,0,0,0.3); }
  .track-cover::after { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,0.2),transparent); }
  .track-info { flex:1; min-width:0; }
  .track-title { font-family:'Cormorant Garamond',serif; font-size:0.92rem; font-weight:600; color:var(--ink); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .badge { display:inline-flex; align-items:center; gap:4px; padding:1px 7px; border-radius:20px; font-size:9px; font-weight:500; letter-spacing:0.5px; text-transform:uppercase; background:var(--accent-bg); color:var(--accent); }
  .track-label { font-size:10.5px; color:var(--muted); font-weight:300; }
  .eq-bars { display:none; align-items:flex-end; gap:2px; height:16px; width:16px; flex-shrink:0; }
  .eq-bars span { display:block; width:3px; border-radius:1px; background:var(--accent); height:4px; }
  .track-card.playing .eq-bars { display:flex; }
  .track-card.playing .eq-bars span:nth-child(1){animation:eq .80s ease-in-out infinite}
  .track-card.playing .eq-bars span:nth-child(2){animation:eq .65s ease-in-out infinite .15s}
  .track-card.playing .eq-bars span:nth-child(3){animation:eq .90s ease-in-out infinite .05s}
  @keyframes eq{0%,100%{height:3px}50%{height:14px}}
  .play-btn { width:36px; height:36px; border-radius:50%; border:2px solid var(--accent); background:var(--card); color:var(--accent); font-size:11px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s ease; flex-shrink:0; }
  .play-btn .fa-play { margin-left:2px; }
  .play-btn:hover, .track-card.playing .play-btn { background:var(--accent); color:#fff; transform:scale(1.08); }
  .wave-wrap { position:relative; background:rgba(255,255,255,0.04); border-radius:8px; height:44px; cursor:pointer; }
  .wave-inner { height:44px; display:block; }
  .time-label { position:absolute; bottom:4px; right:7px; font-size:9.5px; font-family:monospace; color:rgba(220,216,240,0.30); pointer-events:none; z-index:10; letter-spacing:0.5px; }
  .cur-label  { position:absolute; bottom:4px; left:7px;  font-size:9.5px; font-family:monospace; color:var(--accent); pointer-events:none; z-index:10; letter-spacing:0.5px; }
  .page-footer { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-top:6px; padding-top:12px; border-top:1px solid var(--border); }
  .footer-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .action-btn { background:var(--card); border:1px solid var(--border); padding:5px 12px; border-radius:8px; font-size:11.5px; color:var(--ink); cursor:pointer; transition:0.2s; display:flex; align-items:center; gap:6px; font-family:'DM Sans',sans-serif; font-weight:400; }
  .action-btn:hover { background:rgba(255,255,255,0.12); color:#fff; border-color:rgba(255,255,255,0.2); }
  .brand-logo { display:flex; align-items:center; gap:10px; }
  .brand-icon { width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,#3a6ea8,#2a8a7a); display:flex; align-items:center; justify-content:center; box-shadow:0 3px 10px rgba(58,110,168,0.3); }
  .brand-icon i { font-size:14px; color:white; }
  .brand-text { font-family:'Cormorant Garamond',serif; font-size:15px; font-weight:600; color:var(--ink); letter-spacing:1px; }
  .brand-sub { font-size:9px; color:rgba(220,216,240,0.35); display:block; line-height:1; letter-spacing:1px; text-transform:uppercase; }
  .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-12px); background:#ddd8f0; color:#1c2030; padding:10px 22px; border-radius:30px; font-size:13px; opacity:0; visibility:hidden; transition:0.3s; z-index:1000; }
  .toast.show { opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="toast" class="toast">🔗 Посилання скопійовано!</div>
<div class="page-wrap">
  <div class="page-header">
    <div class="header-eyebrow">Worship Collection</div>
    <h1 id="hTitle">…</h1>
    <p id="hSubtitle"></p>
  </div>
  <div id="tracklist">
    <div class="state-msg"><i class="fas fa-compact-disc fa-spin"></i>Завантаження…</div>
  </div>
  <div class="page-footer">
    <div class="footer-actions">
      <button class="action-btn" onclick="shareTG()"><i class="fab fa-telegram-plane"></i> Telegram</button>
      <button class="action-btn" onclick="copyLink()"><i class="fas fa-link"></i> Посилання</button>
    </div>
    <div class="brand-logo">
      <div class="brand-icon"><i class="fas fa-music"></i></div>
      <div><span class="brand-text">МЕЛОДІЯ</span><span class="brand-sub">christian music</span></div>
    </div>
  </div>
</div>
<script type="module">
import WaveSurfer from 'https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.esm.js';

const params  = new URLSearchParams(location.search);
const dir     = params.get('dir');
const cfgPath = dir ? `./${dir}/config.json` : './config.json';
const baseDir = dir ? `./${dir}/` : './';

const WAVE = [
  {wave:'#2a3550',progress:'#6b9fd4'},{wave:'#1e3030',progress:'#5ab8a8'},
  {wave:'#222e18',progress:'#8aaa60'},{wave:'#1e2c35',progress:'#7aa0b0'},
  {wave:'#2a1e35',progress:'#b07cc0'},{wave:'#2d2410',progress:'#d4aa60'},
  {wave:'#2d1e10',progress:'#c07850'},{wave:'#102030',progress:'#5090b8'},
];
const fmt = s => new Date(s*1000).toISOString().substr(14,5);

let cfg;
try {
  const res = await fetch(cfgPath);
  if (!res.ok) throw new Error(res.status);
  cfg = await res.json();
} catch(e) {
  document.getElementById('tracklist').innerHTML =
    `<div class="state-msg"><i class="fas fa-triangle-exclamation"></i>
     Не вдалось завантажити config.json<br><small style="opacity:.5">${cfgPath}</small></div>`;
  throw e;
}

document.title = cfg.title || 'Worship Player';
document.getElementById('hTitle').textContent    = cfg.title    || '';
document.getElementById('hSubtitle').textContent = cfg.subtitle || '';

const list = document.getElementById('tracklist');
list.innerHTML = '';

cfg.tracks.forEach((t, i) => {
  const ci = t.color ?? (i % 8);
  list.insertAdjacentHTML('beforeend', `
    <div class="track-card" id="card-${i}" data-color="${ci}">
      <div class="track-top">
        <div class="track-cover"><i class="fas ${t.icon||'fa-music'}"></i></div>
        <div class="track-info">
          <div class="track-title">${t.title}</div>
          <div class="track-meta">
            ${t.badge?`<span class="badge">${t.badge}</span>`:''}
            <span class="eq-bars"><span></span><span></span><span></span></span>
            ${t.label?`<span class="track-label">${t.label}</span>`:''}
          </div>
        </div>
        <button class="play-btn" id="btn-${i}" onclick="window._play(${i})">
          <i class="fas fa-play"></i>
        </button>
      </div>
      <div class="wave-wrap">
        <div id="wave-${i}" class="wave-inner"></div>
        <span class="cur-label" id="cur-${i}">00:00</span>
        <span class="time-label" id="dur-${i}">--:--</span>
      </div>
    </div>`);
});

const players = cfg.tracks.map((t, i) => {
  const c  = WAVE[t.color ?? (i % 8)];
  const ws = WaveSurfer.create({
    container:`#wave-${i}`, waveColor:c.wave, progressColor:c.progress,
    barWidth:1, barGap:0.5, barRadius:1, height:44,
    interact:true, normalize:true, volume:1,
    url: baseDir + t.src,
  });
  const btn  = () => document.getElementById(`btn-${i}`);
  const card = () => document.getElementById(`card-${i}`);
  ws.on('ready',      dur => document.getElementById(`dur-${i}`).textContent = fmt(dur));
  ws.on('timeupdate', cur => document.getElementById(`cur-${i}`).textContent = fmt(cur));
  ws.on('play',  () => { btn().innerHTML='<i class="fas fa-pause"></i>'; card().classList.add('playing'); players.forEach((p,j)=>{ if(j!==i&&p.isPlaying())p.pause(); }); });
  ws.on('pause', () => { btn().innerHTML='<i class="fas fa-play"></i>';  card().classList.remove('playing'); });
  ws.on('finish',() => players[(i+1)%players.length].play());
  return ws;
});

window._play = i => players[i].playPause();
window.shareTG  = () => window.open(`https://t.me/share/url?url=${encodeURIComponent(location.href)}`,'_blank');
window.copyLink = () => navigator.clipboard.writeText(location.href).then(()=>{ const t=document.getElementById('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); });
</script>
</body>
</html>
